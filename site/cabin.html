<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LeMSIC Cabin</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700&family=Alegreya+Sans:wght@400;500&display=swap">
<style>
  /* Layout: one full-bleed scene (the cabin at night) with a slim caption bar beneath. Single dark look. */
  :root {
    --night: #0d0a08;          /* the room beyond the frame */
    --hearth: #17110d;         /* bar background, warm soot */
    --snow: #f2ece4;           /* main text */
    --ash: #a99b8d;            /* secondary text */
    --ember: #f2a24f;          /* accent: firelight */
    --ember-dim: rgba(242, 162, 79, 0.28);
    --display: "Alegreya SC", "Palatino Linotype", Palatino, Georgia, serif;
    --body: "Alegreya Sans", "Gill Sans", "Trebuchet MS", system-ui, sans-serif;
    --bar: 76px;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--night);
    color: var(--snow);
    font-family: var(--body);
    font-size: 16px;
    display: flex;
    flex-direction: column;
  }

  .scene-wrap {
    flex: 1 1 auto;
    min-height: 0;
    overflow-x: auto;
    overflow-y: hidden;
    scrollbar-width: none;
    display: flex;
    align-items: center;
  }
  .scene-wrap::-webkit-scrollbar { display: none; }
  .stage {
    position: relative;
    flex: 0 0 auto;
    height: min(calc(100dvh - var(--bar)), max(56.25vw, 50dvh));
    aspect-ratio: 16 / 9;
    margin-inline: auto;
    overflow: hidden;
    background: #1a120c;
  }
  .stage img, .stage canvas {
    position: absolute;
    display: block;
    user-select: none;
    -webkit-user-drag: none;
  }
  .stage img { inset: 0; width: 100%; height: 100%; max-width: none; }
  .stage .light { opacity: 0; will-change: opacity; }
  .stage canvas.fire { mix-blend-mode: screen; pointer-events: none; }
  @supports (mix-blend-mode: plus-lighter) { .stage canvas.fire { mix-blend-mode: plus-lighter; } }
  .stage canvas.snow { pointer-events: none; }

  .bar {
    flex: 0 0 var(--bar);
    box-sizing: border-box;
    min-height: var(--bar);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 10px;
    background: var(--hearth);
    border-top: 1px solid var(--ember-dim);
  }
  .title { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .title h1 {
    margin: 0;
    font-family: var(--display);
    font-weight: 700;
    font-size: clamp(1.15rem, 2.4vw, 1.5rem);
    letter-spacing: 0.04em;
    line-height: 1.1;
    text-wrap: balance;
  }
  .title p {
    margin: 0;
    color: var(--ash);
    font-size: 0.9rem;
    letter-spacing: 0.02em;
  }
  .sound {
    flex: 0 0 auto;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 9px 16px;
    border-radius: 999px;
    border: 1px solid var(--ember-dim);
    background: transparent;
    color: var(--snow);
    font: 500 0.95rem var(--body);
    cursor: pointer;
  }
  .sound:hover { border-color: var(--ember); }
  .sound:focus-visible { outline: 2px solid var(--ember); outline-offset: 3px; }
  .sound .dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--ash);
    box-shadow: none;
  }
  .sound[aria-pressed="true"] .dot { background: var(--ember); box-shadow: 0 0 10px var(--ember); }

  @media (max-width: 520px) {
    :root { --bar: 92px; }
    .title p { font-size: 0.82rem; }
  }
</style>
</head>
<body>
  <div class="scene-wrap" id="sceneWrap">
    <div class="stage" id="stage" role="img"
         aria-label="A log cabin at night: the decorated LeMSIC Christmas tree in the middle, a stone fireplace burning on the left, snow falling outside the window on the right.">
      <img id="imgBase" src="assets/cabin/cabin-low.jpg" alt="">
      <img id="imgLeft" class="light" src="assets/cabin/cabin-left.jpg" alt="">
      <img id="imgRight" class="light" src="assets/cabin/cabin-right.jpg" alt="">
      <canvas id="snow" class="snow"></canvas>
      <canvas id="fire" class="fire"></canvas>
    </div>
  </div>
  <div class="bar">
    <div class="title">
      <h1>LeMSIC Advent Calendar</h1>
      <p>The cabin · 1–24 December</p>
    </div>
    <button class="sound" id="soundBtn" type="button" aria-pressed="false">
      <span class="dot" aria-hidden="true"></span><span id="soundLabel">Fire sound off</span>
    </button>
  </div>

<script src="assets/cabin/scene.js"></script>
<script src="assets/cabin/fire.js"></script>
<script>
(() => {
  const S = window.CABIN_SCENE;
  const F = window.CABIN_FIRE;
  const stage = document.getElementById('stage');
  const wrap = document.getElementById('sceneWrap');
  const imgLeft = document.getElementById('imgLeft');
  const imgRight = document.getElementById('imgRight');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  function bilinear(q, u, v) {
    const [a, b, c, d] = q;
    const bot = [a[0] + (b[0] - a[0]) * u, a[1] + (b[1] - a[1]) * u];
    const top = [d[0] + (c[0] - d[0]) * u, d[1] + (c[1] - d[1]) * u];
    return [bot[0] + (top[0] - bot[0]) * v, bot[1] + (top[1] - bot[1]) * v];
  }

  // ---------------------------------------------------------------- fire: the Blender-rendered loop
  const fireCanvas = document.getElementById('fire');
  const fctx = fireCanvas.getContext('2d');
  const crop = F.crop;
  Object.assign(fireCanvas.style, {
    left: crop.x0 * 100 + '%', top: crop.y0 * 100 + '%',
    width: (crop.x1 - crop.x0) * 100 + '%', height: (crop.y1 - crop.y0) * 100 + '%',
  });
  const sprite = new Image();
  let spriteReady = false;
  sprite.onload = () => { spriteReady = true; };
  sprite.src = 'assets/cabin/fire-sprite.jpg';

  function drawSpriteFrame(k, alpha) {
    const c = k % F.cols, r = Math.floor(k / F.cols);
    fctx.globalAlpha = alpha;
    fctx.drawImage(sprite, c * F.frameWidth, r * F.frameHeight, F.frameWidth, F.frameHeight,
                   0, 0, fireCanvas.width, fireCanvas.height);
  }
  function drawFire(pos) {
    if (!spriteReady) return;
    const i = Math.floor(pos) % F.frames, j = (i + 1) % F.frames, f = pos - Math.floor(pos);
    fctx.globalCompositeOperation = 'copy';
    drawSpriteFrame(i, 1);
    fctx.globalCompositeOperation = 'source-over';
    drawSpriteFrame(j, f);                          // fade towards the next frame
    fctx.globalAlpha = 1;
  }
  // the fire's measured brightness drives the firelight on the room and tree
  function fireLight(pos) {
    const i = Math.floor(pos) % F.frames, j = (i + 1) % F.frames, f = pos - Math.floor(pos);
    const A = F.flicker[i], B = F.flicker[j];
    return { a: A[0] + (B[0] - A[0]) * f, b: A[1] + (B[1] - A[1]) * f };
  }

  // ---------------------------------------------------------------- snow outside the window
  const snowCanvas = document.getElementById('snow');
  const win = S.window;
  const wx0 = Math.min(...win.map(p => p[0])), wx1 = Math.max(...win.map(p => p[0]));
  const wy0 = Math.min(...win.map(p => p[1])), wy1 = Math.max(...win.map(p => p[1]));
  Object.assign(snowCanvas.style, {
    left: wx0 * 100 + '%', top: wy0 * 100 + '%', width: (wx1 - wx0) * 100 + '%', height: (wy1 - wy0) * 100 + '%',
  });
  const sctx = snowCanvas.getContext('2d');
  const flakes = Array.from({ length: 110 }, () => ({
    u: Math.random(), v: Math.random(), depth: Math.random(), phase: Math.random() * Math.PI * 2,
  }));
  // window bars (in window u, v) that hide the snow behind them
  const bars = [[0.5, null, 0.022], [null, 1 / 3, 0.017], [null, 2 / 3, 0.017]];

  // ---------------------------------------------------------------- sizing
  let W = 0, H = 0, dpr = 1;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    const r = stage.getBoundingClientRect();
    W = r.width; H = r.height;
    fireCanvas.width = Math.max(1, Math.round((crop.x1 - crop.x0) * W * dpr));
    fireCanvas.height = Math.max(1, Math.round((crop.y1 - crop.y0) * H * dpr));
    snowCanvas.width = Math.max(1, Math.round((wx1 - wx0) * W * dpr));
    snowCanvas.height = Math.max(1, Math.round((wy1 - wy0) * H * dpr));
  }
  new ResizeObserver(resize).observe(stage);
  resize();
  // on narrow screens, start with the fireplace and the tree in view
  requestAnimationFrame(() => {
    const extra = stage.offsetWidth - wrap.clientWidth;
    if (extra > 0) wrap.scrollLeft = Math.max(0, Math.min(extra, stage.offsetWidth * 0.33 - wrap.clientWidth / 2));
  });

  function drawSnow(dt) {
    const cw = snowCanvas.width, ch = snowCanvas.height;
    sctx.clearRect(0, 0, cw, ch);
    const toCanvas = (u, v) => {
      const p = bilinear(win, u, v);
      return [(p[0] - wx0) / (wx1 - wx0) * cw, (p[1] - wy0) / (wy1 - wy0) * ch];
    };
    sctx.save();
    sctx.beginPath();
    win.forEach((p, i) => { const q = toCanvas(i === 1 || i === 2 ? 1 : 0, i >= 2 ? 1 : 0); i ? sctx.lineTo(...q) : sctx.moveTo(...q); });
    sctx.closePath();
    sctx.clip();
    for (const f of flakes) {
      f.v -= (0.04 + f.depth * 0.08) * dt;
      f.phase += dt * (0.5 + f.depth);
      f.u += Math.sin(f.phase) * 0.0007 * (0.5 + f.depth) - 0.003 * dt;
      if (f.v < -0.02) { f.v = 1.02; f.u = Math.random() * 1.1; }
      if (f.u < -0.05) f.u += 1.1;
      const [x, y] = toCanvas(f.u, f.v);
      const r = (0.6 + f.depth * 1.4) * dpr * (W / 1400);
      // soft, out-of-focus flakes: the camera is focused on the tree
      const g = sctx.createRadialGradient(x, y, 0, x, y, Math.max(1, r * 1.8));
      g.addColorStop(0, `rgba(222, 232, 245, ${0.22 + f.depth * 0.38})`);
      g.addColorStop(1, 'rgba(222, 232, 245, 0)');
      sctx.fillStyle = g;
      sctx.beginPath();
      sctx.arc(x, y, Math.max(1, r * 1.8), 0, Math.PI * 2);
      sctx.fill();
    }
    sctx.globalCompositeOperation = 'destination-out';
    for (const [u, v, w] of bars) {
      sctx.beginPath();
      const pts = u !== null
        ? [toCanvas(u - w, 0), toCanvas(u + w, 0), toCanvas(u + w, 1), toCanvas(u - w, 1)]
        : [toCanvas(0, v - w), toCanvas(1, v - w), toCanvas(1, v + w), toCanvas(0, v + w)];
      pts.forEach((q, i) => i ? sctx.lineTo(...q) : sctx.moveTo(...q));
      sctx.closePath();
      sctx.fill();
    }
    sctx.globalCompositeOperation = 'source-over';
    sctx.restore();
  }

  let last = performance.now();
  let light = { a: 0.5, b: 0.5 };
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    const pos = reduceMotion ? 0 : (now / 1000) * F.fps;
    drawFire(pos);
    const target = reduceMotion ? { a: 0.5, b: 0.5 } : fireLight(pos);
    const k = Math.min(1, dt * 10);                     // a little smoothing, like real light
    light = { a: light.a + (target.a - light.a) * k, b: light.b + (target.b - light.b) * k };
    imgLeft.style.opacity = light.a.toFixed(3);
    imgRight.style.opacity = (light.b * 0.85).toFixed(3);
    drawSnow(reduceMotion ? 0 : dt);
    audio.update(light);
    if (!reduceMotion) requestAnimationFrame(frame);
    else if (!spriteReady) requestAnimationFrame(frame);
  }

  // ---------------------------------------------------------------- crackling fire sound (generated, no files)
  const audio = (() => {
    let ctx = null, master = null, rumbleGain = null, timer = null, on = false;
    function noiseBuffer(seconds, brown) {
      const len = Math.floor(ctx.sampleRate * seconds), buf = ctx.createBuffer(1, len, ctx.sampleRate);
      const d = buf.getChannelData(0); let last = 0;
      for (let i = 0; i < len; i++) {
        const w = Math.random() * 2 - 1;
        if (brown) { last = (last + 0.02 * w) / 1.02; d[i] = last * 3.5; } else d[i] = w;
      }
      return buf;
    }
    let white = null;
    function crackle() {
      if (!on) return;
      const now = ctx.currentTime;
      const src = ctx.createBufferSource();
      src.buffer = white;
      const bp = ctx.createBiquadFilter();
      bp.type = 'bandpass';
      bp.frequency.value = 1200 + Math.random() * 3800;
      bp.Q.value = 0.8 + Math.random() * 2;
      const g = ctx.createGain();
      const peak = 0.15 + Math.random() * 0.5;
      const dur = 0.006 + Math.random() * 0.03;
      g.gain.setValueAtTime(peak, now);
      g.gain.exponentialRampToValueAtTime(0.0008, now + dur);
      src.connect(bp).connect(g).connect(master);
      src.start(now, Math.random() * 1.5, dur + 0.02);
      // pops come in little clusters, like real wood
      const nextIn = Math.random() < 0.3 ? 20 + Math.random() * 60 : 90 + Math.random() * 420;
      timer = setTimeout(crackle, nextIn);
    }
    function start() {
      if (!ctx) {
        ctx = new (window.AudioContext || window.webkitAudioContext)();
        master = ctx.createGain();
        master.gain.value = 0.6;
        master.connect(ctx.destination);
        white = noiseBuffer(2, false);
        const rumble = ctx.createBufferSource();
        rumble.buffer = noiseBuffer(4, true);
        rumble.loop = true;
        const lp = ctx.createBiquadFilter();
        lp.type = 'lowpass';
        lp.frequency.value = 520;
        rumbleGain = ctx.createGain();
        rumbleGain.gain.value = 0.0;
        rumble.connect(lp).connect(rumbleGain).connect(master);
        rumble.start();
      }
      ctx.resume();
      on = true;
      crackle();
    }
    function stop() { on = false; clearTimeout(timer); if (ctx) ctx.suspend(); }
    return {
      toggle() { on ? stop() : start(); return on; },
      update(f) { if (on && rumbleGain) rumbleGain.gain.setTargetAtTime(0.18 + 0.25 * (f.a + f.b) / 2, ctx.currentTime, 0.08); },
    };
  })();

  const btn = document.getElementById('soundBtn');
  const label = document.getElementById('soundLabel');
  btn.addEventListener('click', () => {
    const on = audio.toggle();
    btn.setAttribute('aria-pressed', String(on));
    label.textContent = on ? 'Fire sound on' : 'Fire sound off';
  });

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
