<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LeMSIC Advent Calendar</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
  /* Layout: one full-bleed scene (outside the cabin door, then inside by the tree) above a slim bar. Single dark look. */
  :root {
    --night: #0d0a08;
    --hearth: #17110d;
    --card: rgba(24, 17, 12, 0.94);
    --snow: #f2ece4;
    --ash: #b0a191;
    --ember: #f2a24f;
    --ember-deep: #c9772a;
    --ember-dim: rgba(242, 162, 79, 0.3);
    --lemsic: #3c6bad;
    --error: #ff9b8a;
    --display: "Alegreya SC", "Palatino Linotype", Palatino, Georgia, serif;
    --body: "Alegreya Sans", "Gill Sans", "Trebuchet MS", system-ui, sans-serif;
    --bar: 76px;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--night);
    color: var(--snow);
    font-family: var(--body);
    font-size: 16px;
    display: flex;
    flex-direction: column;
  }
  button { font: inherit; color: inherit; }

  /* ---------- the scene */
  .scene-wrap {
    flex: 1 1 auto; min-height: 0;
    overflow-x: auto; overflow-y: hidden; scrollbar-width: none;
    display: flex; align-items: center;
  }
  .scene-wrap::-webkit-scrollbar { display: none; }
  .stage {
    position: relative; flex: 0 0 auto;
    height: min(calc(100dvh - var(--bar)), max(56.25vw, 64dvh));
    aspect-ratio: 16 / 9; max-width: none;
    margin-inline: auto; overflow: hidden;
    background: #120d0a;
  }
  .view { position: absolute; inset: 0; }
  .view img, .view canvas { position: absolute; display: block; user-select: none; -webkit-user-drag: none; }
  .view img { inset: 0; width: 100%; height: 100%; max-width: none; }
  #outside, #inside { will-change: transform, opacity; }
  #inside { transform-origin: 50% 62%; }
  #snowFront { inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #inside .light { opacity: 0; will-change: opacity; }
  /* the tree's fairy lights: two sets of bulbs that brighten and dim in turn, softly */
  #inside .glow { opacity: 0; will-change: opacity; pointer-events: none; mix-blend-mode: screen; }
  @supports (mix-blend-mode: plus-lighter) { #inside .glow { mix-blend-mode: plus-lighter; } }
  canvas.fire { mix-blend-mode: screen; pointer-events: none; }
  @supports (mix-blend-mode: plus-lighter) { canvas.fire { mix-blend-mode: plus-lighter; } }
  canvas.snow { pointer-events: none; }
  canvas.rock { pointer-events: none; opacity: 0; }

  /* Fares in his rocking chair: click him to give the chair a push */
  .fares { position: absolute; border: 0; padding: 0; background: transparent; cursor: pointer; border-radius: 40% 40% 12% 12%; }
  .fares::before {
    content: attr(data-label); position: absolute; left: 50%; top: -4px; transform: translate(-50%, -100%);
    white-space: nowrap; padding: 3px 10px; border-radius: 999px; pointer-events: none;
    background: var(--card); border: 1px solid var(--ember-dim); color: var(--snow); font: 500 clamp(11px, 1vw, 14px) var(--body);
    opacity: 0; transition: opacity .25s;
  }
  .fares:hover::before, .fares:focus-visible::before { opacity: 1; }
  .fares:focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; }

  /* ornaments you can open */
  .ornaments { position: absolute; inset: 0; pointer-events: none; }
  .orn {
    pointer-events: auto;
    position: absolute; aspect-ratio: 1; transform: translate(-50%, -50%);
    border-radius: 50%; border: 0; padding: 0; background: transparent; cursor: pointer;
  }
  .orn:hover, .orn:focus-visible { box-shadow: 0 0 0 1.5px rgba(239, 228, 204, 0.75), 0 0 14px rgba(255, 220, 170, 0.35); outline: none; }
  /* a paper gift tag tied beside the ornament: "Today" on today's, a green tick once its picture is on the wall */
  .gtag {
    position: absolute; left: 78%; top: 2%; display: flex; align-items: center; pointer-events: none;
    transform-origin: 0 50%; filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.55));
  }
  .gtag.today { animation: tag-sway 3.4s ease-in-out infinite; }
  .gtag.done { transform: rotate(16deg); }
  @keyframes tag-sway { 0%, 100% { transform: rotate(14deg); } 50% { transform: rotate(4deg); } }
  .gstring { flex: none; width: 11px; height: 1px; background: rgba(239, 228, 204, 0.85); }
  .gcard {
    position: relative; white-space: nowrap; background: #efe4cc; color: #2a1a0c;
    font: 700 clamp(10px, 0.95vw, 14px)/1 var(--display); padding: 4px 8px 4px 12px;
    clip-path: polygon(7px 0, 100% 0, 100% 100%, 7px 100%, 0 50%);
  }
  .gcard::before {
    content: ""; position: absolute; left: 5px; top: 50%; width: 3px; height: 3px; margin-top: -1.5px;
    border-radius: 50%; background: rgba(0, 0, 0, 0.45);
  }
  .gtag.done .gcard { color: #2d6a3a; padding: 3px 6px 3px 11px; }

  /* ---------- the bar */
  .bar {
    flex: 0 0 var(--bar); box-sizing: border-box; min-height: var(--bar);
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 10px;
    background: var(--hearth); border-top: 1px solid var(--ember-dim);
  }
  .title { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .title h1 { margin: 0; font: 700 clamp(1.1rem, 2.2vw, 1.45rem)/1.1 var(--display); letter-spacing: .04em; text-wrap: balance; }
  .title p { margin: 0; color: var(--ash); font-size: .9rem; }
  .bar-actions { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; justify-content: flex-end; }
  .progress { display: grid; grid-template-columns: repeat(12, 7px); gap: 3px; }
  .progress i { width: 7px; height: 7px; border-radius: 50%; background: rgba(242, 236, 228, 0.16); }
  .progress i.on { background: var(--ember); }
  .progress i.now { box-shadow: 0 0 0 1.5px var(--snow); }
  .pill {
    display: inline-flex; align-items: center; gap: 9px; padding: 8px 15px; border-radius: 999px;
    border: 1px solid var(--ember-dim); background: transparent; cursor: pointer; font-weight: 500; font-size: .92rem;
  }
  .pill:hover { border-color: var(--ember); }
  .pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ash); }
  .pill[aria-pressed="true"] .dot { background: var(--ember); box-shadow: 0 0 9px var(--ember); }
  .linkbtn { background: none; border: 0; padding: 4px 2px; color: var(--ash); text-decoration: underline; cursor: pointer; font-size: .9rem; }
  :focus-visible { outline: 2px solid var(--ember); outline-offset: 3px; }

  /* ---------- dialogs */
  dialog.card {
    width: min(440px, calc(100vw - 32px)); box-sizing: border-box;
    padding: 28px 26px 22px; border-radius: 18px;
    border: 1px solid var(--ember-dim); background: var(--card); color: var(--snow);
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
  }
  dialog.card::backdrop { background: rgba(6, 4, 3, 0.45); backdrop-filter: blur(2px); }
  dialog.card[open] { animation: rise .45s cubic-bezier(.2, .8, .2, 1); }
  @keyframes rise { from { opacity: 0; transform: translateY(14px) scale(.98); } }
  .card h2 { margin: 6px 0 8px; font: 700 1.55rem/1.15 var(--display); letter-spacing: .03em; text-wrap: balance; }
  .card p { margin: 0 0 14px; line-height: 1.5; color: var(--ash); }
  .emblem { display: block; width: 76px; height: 76px; object-fit: cover; border-radius: 50%; margin: 0 auto 10px;
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.08); }
  #login { text-align: center; }
  label.field { display: block; text-align: left; font-size: .85rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ash); margin-bottom: 6px; }
  .input {
    width: 100%; box-sizing: border-box; padding: 13px 14px; border-radius: 11px;
    border: 1px solid rgba(242, 236, 228, 0.22); background: rgba(0, 0, 0, 0.35); color: var(--snow);
    font: 500 1.15rem var(--body); letter-spacing: .06em; text-align: center;
  }
  .input:focus { border-color: var(--ember); outline: none; box-shadow: 0 0 0 3px var(--ember-dim); }
  .input[aria-invalid="true"] { border-color: var(--error); }
  .who { min-height: 1.45em; margin: 8px 0 0 !important; color: var(--snow) !important; font-weight: 500; font-size: 1rem;
         opacity: 0; transition: opacity .25s; }
  .who.show { opacity: 1; }
  .who .tick { color: var(--ember); margin-right: 6px; }
  .guest-note { margin: 12px 0 0 !important; font-size: .82rem; color: var(--ash) !important; opacity: .85; }
  .guest-note strong { color: var(--snow); font-weight: 600; letter-spacing: .06em; }
  .error { min-height: 1.4em; margin: 8px 0 6px !important; color: var(--error) !important; font-size: .92rem; }
  .primary {
    width: 100%; padding: 13px 18px; border-radius: 11px; border: 0; cursor: pointer;
    background: linear-gradient(180deg, var(--ember), var(--ember-deep)); color: #24150a;
    font: 700 1.05rem var(--body); letter-spacing: .02em;
  }
  .primary:disabled { opacity: .6; cursor: progress; }
  .fine { margin: 14px 0 0 !important; font-size: .82rem; }
  .ghost { margin-top: 10px; width: 100%; padding: 10px; border-radius: 11px; border: 1px solid rgba(242, 236, 228, 0.18); background: transparent; cursor: pointer; }

  .prize { border: 1px solid var(--ember); border-radius: 12px; padding: 12px 14px; color: var(--snow) !important; background: rgba(242, 162, 79, 0.08); }

  /* ---------- what pops out of an ornament: a picture and its caption, like a photo print */
  dialog.popout {
    padding: 16px; border: 0; background: transparent; color: var(--snow); overflow: visible;
    max-width: calc(100vw - 16px); max-height: calc(100dvh - 16px); box-sizing: border-box;
    flex-direction: column; align-items: center; gap: 18px;
  }
  dialog.popout[open] { display: flex; }
  dialog.popout::backdrop { background: rgba(6, 4, 3, 0.62); backdrop-filter: blur(3px); }
  .polaroid {
    margin: 0; padding: 12px 12px 0; box-sizing: border-box; border-radius: 3px;
    width: fit-content; min-width: min(280px, calc(100vw - 48px)); max-width: min(584px, calc(100vw - 48px));
    background: #f6f1e7; box-shadow: 0 2px 0 rgba(0, 0, 0, 0.1), 0 26px 70px rgba(0, 0, 0, 0.65);
    transform: rotate(-1.5deg);
  }
  .polaroid img { display: block; margin: 0 auto; max-width: 100%; border-radius: 2px; background: #e4ddd1; }
  /* the caption wraps to the picture's width instead of widening the print */
  .polaroid figcaption { width: 0; min-width: 100%; box-sizing: border-box;
                         padding: 14px 10px 18px; color: #2b1e15; text-align: center; text-wrap: balance;
                         font: 500 clamp(1.05rem, 2.4vw, 1.3rem)/1.35 var(--display); letter-spacing: .02em; }
  .polaroid figcaption:empty { padding: 6px 0; }
  .popinfo { width: min(440px, calc(100vw - 48px)); text-align: center; }
  .popinfo p { margin: 0 0 10px; color: var(--ash); line-height: 1.45; }
  .popinfo .fact { text-align: left; }
  .popinfo .primary { max-width: 260px; }
  .burst { position: fixed; border-radius: 50%; pointer-events: none; transform: translate(-50%, -50%);
           background: radial-gradient(circle, rgba(255, 244, 214, 0.95), rgba(255, 196, 120, 0.45) 42%, rgba(255, 196, 120, 0) 70%); }

  /* ---------- the picture wall: each hung picture laid into its frame, shaded to the room's light */
  .wall { position: absolute; inset: 0; pointer-events: none; }
  .wpic { position: absolute; overflow: hidden; background: #000; pointer-events: none; }
  .wpic img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .wpic .shade { position: absolute; inset: 0; mix-blend-mode: multiply; }
  .wpic::after {                       /* the glass over the print, and the shadow of the mat's edge */
    content: ""; position: absolute; inset: 0; box-shadow: inset 0 0 3px rgba(0, 0, 0, 0.6);
    background: linear-gradient(125deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0) 40%, rgba(255, 255, 255, 0) 75%, rgba(255, 255, 255, 0.05));
  }
  .wallbtn { position: absolute; border: 0; padding: 0; background: transparent; cursor: zoom-in; pointer-events: auto; border-radius: 6px; }
  .wallbtn::before {
    content: attr(data-label); position: absolute; left: 50%; top: -4px; transform: translate(-50%, -100%);
    white-space: nowrap; padding: 3px 10px; border-radius: 999px; pointer-events: none;
    background: var(--card); border: 1px solid var(--ember-dim); color: var(--snow); font: 500 clamp(11px, 1vw, 14px) var(--body);
    opacity: 0; transition: opacity .25s;
  }
  .wallbtn:hover::before, .wallbtn:focus-visible::before { opacity: 1; }
  .wallbtn:hover, .wallbtn:focus-visible { box-shadow: 0 0 0 2px rgba(255, 236, 200, 0.45), 0 0 30px rgba(255, 200, 130, 0.25); outline: none; }

  /* the wall up close: every frame, with the pictures hung so far */
  dialog.wallview {
    width: min(860px, calc(100vw - 24px)); max-height: calc(100dvh - 24px); box-sizing: border-box; overflow-y: auto;
    padding: 22px clamp(14px, 3vw, 30px) 26px; border-radius: 16px; border: 1px solid var(--ember-dim); color: var(--snow);
    background:
      linear-gradient(rgba(14, 9, 6, 0.78), rgba(14, 9, 6, 0.86)),
      repeating-linear-gradient(180deg, #4a2e1a 0 46px, #2a190d 46px 50px, #5a3820 50px 52px);
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
  }
  dialog.wallview::backdrop { background: rgba(6, 4, 3, 0.55); backdrop-filter: blur(3px); }
  dialog.wallview[open] { animation: rise .45s cubic-bezier(.2, .8, .2, 1); }
  .wallhead { display: flex; align-items: baseline; gap: 14px; margin: 0 0 18px; }
  .wallhead h2 { margin: 0; font: 700 clamp(1.3rem, 3vw, 1.7rem)/1.1 var(--display); letter-spacing: .03em; }
  .wallhead p { margin: 0; color: var(--ash); flex: 1; }
  .wallhead .x { border: 1px solid rgba(242, 236, 228, 0.2); background: transparent; color: var(--snow); width: 34px; height: 34px;
                 border-radius: 50%; cursor: pointer; font-size: 1.1rem; line-height: 1; flex: none; align-self: center; }
  .wallgrid { display: grid; grid-template-columns: repeat(6, 1fr); gap: clamp(14px, 2.4vw, 26px) clamp(10px, 2vw, 22px); }
  @media (max-width: 620px) { .wallgrid { grid-template-columns: repeat(4, 1fr); } }
  .wframe { display: flex; flex-direction: column; align-items: center; gap: 7px; width: 100%; padding: 0; border: 0;
            background: none; color: inherit; font: inherit; }
  .wframe .moulding, .wframe .mat { display: block; }
  .wframe .moulding {
    width: 100%; aspect-ratio: 1.12; box-sizing: border-box; padding: 9%; border-radius: 2px;
    background: repeating-linear-gradient(90deg, rgba(0, 0, 0, 0.08) 0 2px, rgba(255, 255, 255, 0.03) 2px 5px),
                linear-gradient(145deg, #6b4428, #3a2312 55%, #24150a);
    box-shadow: 0 6px 14px rgba(0, 0, 0, 0.55), inset 0 0 0 1px rgba(255, 220, 170, 0.12);
  }
  .wframe .mat { width: 100%; height: 100%; box-sizing: border-box; padding: 8%; background: #e6dcc6;
                 box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.45); }
  .wframe .print { position: relative; width: 100%; height: 100%; overflow: hidden; display: grid; place-items: center;
                   background: #2a4e8c; color: #eae6dc; font: 700 clamp(1rem, 2.6vw, 1.6rem) var(--display); }
  .wframe .print img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .wframe .print::after { content: ""; position: absolute; inset: 0; pointer-events: none;
                          background: linear-gradient(125deg, rgba(255, 255, 255, 0.16), rgba(255, 255, 255, 0) 45%); }
  .wframe .plate { padding: 0 .45em; border-radius: 2px; font: 700 .8rem/1.4 var(--display); color: #2a1a08;
                   background: linear-gradient(#c49a52, #8a6426); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.6); }
  button.wframe { cursor: zoom-in; }
  button.wframe:hover .moulding, button.wframe:focus-visible .moulding { transform: translateY(-3px); transition: transform .2s; }
  button.wframe:focus-visible { outline: none; }
  button.wframe:focus-visible .moulding { box-shadow: 0 0 0 2px var(--ember), 0 6px 14px rgba(0, 0, 0, 0.55); }
  .wframe.empty .print { opacity: .82; }
  .wtag {
    position: absolute; transform: translateX(-50%); padding: 0 .35em; border-radius: 2px; pointer-events: none;
    font: 700 var(--tag, 10px)/1.3 var(--display); color: #2a1a08;
    background: linear-gradient(#b48a46, #7d5a22); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
  }
  .flyer { position: fixed; z-index: 20; object-fit: cover; pointer-events: none; border: 4px solid #f6f1e7;
           box-shadow: 0 18px 50px rgba(0, 0, 0, 0.55); transform-origin: 50% 50%; }

  /* ---------- test mode, for organisers */
  .testbadge { display: inline-block; margin-left: 8px; padding: 2px 8px; border-radius: 999px; vertical-align: middle;
               background: #8fb8f2; color: #0d1a2e; font: 700 .68rem/1.4 var(--body); letter-spacing: .1em; text-transform: uppercase; }
  .orn.testable { box-shadow: 0 0 0 1.5px rgba(160, 200, 255, 0.6); }

  .toast {
    position: fixed; left: 50%; bottom: calc(var(--bar) + 18px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px);
    max-width: min(440px, calc(100vw - 32px)); padding: 11px 16px; border-radius: 12px;
    background: var(--card); border: 1px solid var(--ember-dim); color: var(--snow); text-align: center;
    opacity: 0; pointer-events: none; transition: opacity .3s, transform .3s; z-index: 5;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 560px) {
    :root { --bar: 104px; }
    .bar { align-items: flex-start; flex-direction: column; justify-content: center; gap: 8px; }
    .title p { font-size: .82rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    .gtag.today { animation: none; transform: rotate(10deg); }
    dialog.card[open], .reveal { animation: none; }
  }
</style>
</head>
<body>
  <div class="scene-wrap" id="sceneWrap">
    <div class="stage" id="stage">
      <section class="view" id="outside" role="img"
               aria-label="Outside a snowy log cabin at night. A carved LeMSIC sign hangs over the front door, a lantern glows beside it.">
        <img src="assets/door/door.jpg" alt="">
        <canvas id="doorAnim"></canvas>
        <canvas id="snowFront"></canvas>
      </section>
      <section class="view" id="inside" hidden>
        <img id="imgBase" src="assets/cabin/cabin-low.jpg" alt="">
        <img id="imgLeft" class="light" src="assets/cabin/cabin-left.jpg" alt="">
        <img id="imgRight" class="light" src="assets/cabin/cabin-right.jpg" alt="">
        <img id="glowA" class="glow" src="assets/cabin/cabin-glow-a.jpg" alt="">
        <img id="glowB" class="glow" src="assets/cabin/cabin-glow-b.jpg" alt="">
        <canvas id="snow" class="snow"></canvas>
        <canvas id="fire" class="fire"></canvas>
        <canvas id="rock" class="rock"></canvas>
        <button class="fares" id="faresBtn" type="button" data-label="Give Fares a push" hidden
                aria-label="Fares, the LeMSIC mascot, in his rocking chair. Give him a push."></button>
        <div class="wall" id="wall" role="group" aria-label="Your picture wall: one frame for each day"></div>
        <div class="ornaments" id="ornaments" role="group" aria-label="Ornaments on the tree, one for each day"></div>
      </section>
    </div>
  </div>

  <div class="bar">
    <div class="title">
      <h1>LeMSIC Advent Calendar<span class="testbadge" id="testBadge" hidden>Test mode</span></h1>
      <p id="status">1–24 December</p>
    </div>
    <div class="bar-actions">
      <div class="progress" id="progress" hidden></div>
      <button class="pill" id="soundBtn" type="button" aria-pressed="false">
        <span class="dot" aria-hidden="true"></span><span id="soundLabel">Fire sound off</span>
      </button>
      <button class="linkbtn" id="switchBtn" type="button" hidden>Exit the Cabin</button>
    </div>
  </div>

  <dialog id="login" class="card" aria-labelledby="loginTitle">
    <form id="loginForm" novalidate>
      <img class="emblem" src="assets/lemsic-emblem.png" alt="LeMSIC emblem">
      <h2 id="loginTitle">Welcome to the cabin</h2>
      <p>Enter your LeMSIC ID to open the door.</p>
      <label class="field" for="lemsicId">LeMSIC ID</label>
      <input class="input" id="lemsicId" name="lemsicId" autocomplete="off" autocapitalize="characters"
             spellcheck="false" required aria-describedby="idWho loginError">
      <p class="who" id="idWho" aria-live="polite"></p>
      <p class="error" id="loginError" role="alert"></p>
      <button type="submit" class="primary" id="loginBtn">Open the door</button>
      <p class="guest-note" id="guestNote">Not a LeMSIC member? Enter <strong id="guestCode">0000</strong> to come in as a guest.</p>
      <p class="fine" id="loginFine">Your ID is checked against the LeMSIC member list.</p>
    </form>
  </dialog>

  <dialog id="wallView" class="wallview" aria-labelledby="wallTitle">
    <div class="wallhead">
      <h2 id="wallTitle">Your picture wall</h2>
      <p id="wallCount"></p>
      <button class="x" type="button" id="wallClose" aria-label="Close the picture wall">✕</button>
    </div>
    <div class="wallgrid" id="wallGrid"></div>
  </dialog>

  <dialog id="popout" class="popout" aria-label="What came out of the ornament">
    <figure class="polaroid" id="polaroid">
      <img id="popImg" alt="">
      <figcaption id="popCaption"></figcaption>
    </figure>
    <div class="popinfo" id="popInfo"></div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="config.js"></script>
<script src="pictures.js"></script>
<script src="assets/members.js"></script>
<script src="assets/door/door.js"></script>
<script src="assets/cabin/scene.js"></script>
<script src="assets/cabin/fire.js"></script>
<script src="assets/cabin/rock.js"></script>
<script>
(() => {
  const C = window.ADVENT_CONFIG, M = window.LEMSIC_MEMBERS, P = window.ADVENT_PICTURES || {};
  const DOOR = window.CABIN_DOOR, S = window.CABIN_SCENE, F = window.CABIN_FIRE, R = window.CABIN_ROCK;
  const $ = (id) => document.getElementById(id);
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const stage = $('stage'), wrap = $('sceneWrap');

  // ---------------------------------------------------------------- small helpers
  const store = {
    get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* private window: keep going */ } },
  };
  const normalise = (s) => s.normalize('NFKC').toUpperCase().replace(/[^A-Z0-9]/g, '');
  async function sha256(text) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
    return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, '0')).join('');
  }
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  let toastTimer = 0;
  function toast(msg) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 3200);
  }
  function scrollTo(fx) {
    const extra = stage.offsetWidth - wrap.clientWidth;
    if (extra > 0) wrap.scrollLeft = Math.max(0, Math.min(extra, stage.offsetWidth * fx - wrap.clientWidth / 2));
  }
  function bilinear(q, u, v) {
    const [a, b, c, d] = q;
    const bot = [a[0] + (b[0] - a[0]) * u, a[1] + (b[1] - a[1]) * u];
    const top = [d[0] + (c[0] - d[0]) * u, d[1] + (c[1] - d[1]) * u];
    return [bot[0] + (top[0] - bot[0]) * v, bot[1] + (top[1] - bot[1]) * v];
  }

  // ---------------------------------------------------------------- the calendar's day
  function lebanonToday() {
    const p = Object.fromEntries(new Intl.DateTimeFormat('en-CA', { timeZone: C.timeZone, year: 'numeric', month: 'numeric', day: 'numeric' })
      .formatToParts(new Date()).filter((x) => x.type !== 'literal').map((x) => [x.type, +x.value]));
    return p;
  }
  function calendarDay() {
    const h = location.hash.match(/^#day-(\d{1,2})$/);
    const preview = h ? +h[1] : C.previewDay;
    if (preview >= 1 && preview <= 24) return { day: preview, preview: true };
    const t = lebanonToday();
    if (t.year === C.year && t.month === 12 && t.day <= 24) return { day: t.day, preview: false };
    const ended = t.year > C.year || (t.year === C.year && t.month === 12);
    return { day: ended ? 25 : 0, preview: false };
  }
  let today = calendarDay();
  window.addEventListener('hashchange', () => { today = calendarDay(); if (member) renderTree(); });

  // ---------------------------------------------------------------- members and the pictures on their wall
  let member = null;            // { id, key }
  let testMode = false;         // organisers: every ornament opens, nothing is saved
  let testWall = {};
  const wallKey = () => `lemsic-advent-${C.year}-${member.key.slice(0, 16)}`;
  const loadWall = () => (testMode ? testWall : (store.get(wallKey()) || {}));
  function hangOnWall(day) {
    const at = new Date().toISOString();
    if (testMode) {
      testWall[day] = { at, test: true };
      return testWall;
    }
    const all = loadWall();
    all[day] = { at, preview: today.preview || undefined };
    store.set(wallKey(), all);
    if (PROGRESS && !today.preview && !member.guest) {
      fetch(PROGRESS, {
        method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({ id: member.id, name: member.name || '', day, at }),
      }).catch(() => { /* kept locally; the sheet will miss this one */ });
    }
    return all;
  }
  // the progress sheet remembers each member's wall, so it follows them to another phone or computer
  const PROGRESS = C.progressEndpoint || C.answersEndpoint || '';
  async function syncWall() {
    if (!PROGRESS || !member || member.guest || testMode || today.preview) return;
    try {
      const res = await fetch(`${PROGRESS}?id=${encodeURIComponent(member.id)}`);
      const data = await res.json();
      if (!data.ok || !Array.isArray(data.days)) return;
      const all = loadWall();
      let added = 0;
      for (const d of data.days) {
        if (d >= 1 && d <= 24 && !all[d]) { all[d] = { at: 'from the progress sheet' }; added += 1; }
      }
      if (added) { store.set(wallKey(), all); renderTree(); }
    } catch (e) { /* offline or not set up: the wall in this browser stands */ }
  }
  const isCode = (id, code) => !!code && !!id && id === normalise(String(code));
  // an ID is stretched (PBKDF2) into its fingerprint and the key that opens that member's name;
  // see tools/import_members.py
  const stretched = new Map();
  async function stretch(id) {
    if (!stretched.has(id)) {
      stretched.set(id, (async () => {
        const enc = new TextEncoder();
        const base = await crypto.subtle.importKey('raw', enc.encode(id), 'PBKDF2', false, ['deriveBits']);
        const bits = new Uint8Array(await crypto.subtle.deriveBits(
          { name: 'PBKDF2', hash: 'SHA-256', salt: enc.encode('lemsic:' + M.salt), iterations: M.rounds }, base, 512));
        return { fp: [...bits.slice(0, 32)].map((b) => b.toString(16).padStart(2, '0')).join(''), key: bits.slice(32) };
      })());
    }
    return stretched.get(id);
  }
  async function openName(key, sealed) {
    if (!sealed) return '';
    try {
      const data = Uint8Array.from(atob(sealed), (c) => c.charCodeAt(0));
      const out = new Uint8Array(data.length);
      for (let i = 0; i * 32 < data.length; i++) {
        const block = new Uint8Array(await crypto.subtle.digest('SHA-256', new Uint8Array([...key, i >>> 24, (i >>> 16) & 255, (i >>> 8) & 255, i & 255])));
        for (let j = 0; j < 32 && i * 32 + j < data.length; j++) out[i * 32 + j] = data[i * 32 + j] ^ block[j];
      }
      return new TextDecoder().decode(out);
    } catch (e) {
      return '';
    }
  }
  // who an ID belongs to: null if it isn't on the list
  async function lookUp(id) {
    const { fp, key } = await stretch(id);
    if (!(fp in M.members)) return null;
    return { key: fp, name: await openName(key, M.members[fp]) };
  }
  async function checkId(raw) {
    const id = normalise(raw);
    if (!id) return { ok: false, msg: 'Type your LeMSIC ID to continue.' };
    if (isCode(id, C.guestCode)) return { ok: true, id: 'GUEST', key: 'guest-visitor', guest: true, name: '' };
    const found = await lookUp(id);
    if (!found) return { ok: false, msg: "We couldn't find that LeMSIC ID. Check it and try again." };
    return { ok: true, id, key: found.key, name: found.name };
  }

  // ---------------------------------------------------------------- outside: snow falling in front of the cabin
  const snowFront = $('snowFront'), sfx = snowFront.getContext('2d');
  const frontFlakes = Array.from({ length: 160 }, () => ({ x: Math.random(), y: Math.random(), z: Math.random(), p: Math.random() * 6.28 }));
  function drawFrontSnow(dt) {
    const w = snowFront.width, h = snowFront.height;
    sfx.clearRect(0, 0, w, h);
    for (const f of frontFlakes) {
      f.y += (0.025 + f.z * 0.06) * dt;
      f.p += dt * (0.4 + f.z);
      f.x += Math.sin(f.p) * 0.0004 * (0.5 + f.z) - 0.004 * dt;
      if (f.y > 1.03) { f.y = -0.03; f.x = Math.random() * 1.1; }
      if (f.x < -0.03) f.x += 1.06;
      const r = (0.8 + f.z * f.z * 3.2) * (w / 1600);
      const g = sfx.createRadialGradient(f.x * w, f.y * h, 0, f.x * w, f.y * h, r * 2);
      g.addColorStop(0, `rgba(235, 242, 252, ${0.25 + f.z * 0.5})`);
      g.addColorStop(1, 'rgba(235, 242, 252, 0)');
      sfx.fillStyle = g;
      sfx.beginPath(); sfx.arc(f.x * w, f.y * h, r * 2, 0, 6.283); sfx.fill();
    }
  }

  // ---------------------------------------------------------------- outside: the door opening
  const doorAnim = $('doorAnim'), dctx = doorAnim.getContext('2d');
  const crop = DOOR.crop;
  Object.assign(doorAnim.style, {
    left: crop.x0 * 100 + '%', top: crop.y0 * 100 + '%',
    width: (crop.x1 - crop.x0) * 100 + '%', height: (crop.y1 - crop.y0) * 100 + '%',
  });
  const doorFrames = [];
  function preloadDoor() {
    for (let i = 0; i < DOOR.frames; i++) {
      const im = new Image();
      im.src = `assets/door/open-${String(i).padStart(2, '0')}.jpg`;
      doorFrames.push(im);
    }
    return Promise.all(doorFrames.map((im) => (im.decode ? im.decode().catch(() => {}) : Promise.resolve())));
  }
  async function playDoor() {
    const fps = 24;
    const start = performance.now();
    await new Promise((done) => {
      function step(now) {
        const i = Math.min(DOOR.frames - 1, Math.floor((now - start) / 1000 * fps));
        const im = doorFrames[i];
        if (im && im.complete && im.naturalWidth > 0) dctx.drawImage(im, 0, 0, doorAnim.width, doorAnim.height);
        if (i < DOOR.frames - 1) requestAnimationFrame(step); else done();
      }
      requestAnimationFrame(step);
    });
  }

  // ---------------------------------------------------------------- inside: fire, firelight, snow at the window
  // a rendered loop (a sprite sheet of frames) added over its patch of the room image
  function spriteLayer(canvas, info, src) {
    const ctx = canvas.getContext('2d');
    Object.assign(canvas.style, {
      left: info.crop.x0 * 100 + '%', top: info.crop.y0 * 100 + '%',
      width: (info.crop.x1 - info.crop.x0) * 100 + '%', height: (info.crop.y1 - info.crop.y0) * 100 + '%',
    });
    const img = new Image();
    let ready = false;
    img.onload = () => { ready = true; };
    function frameAt(k, alpha) {
      const c = k % info.cols, r = Math.floor(k / info.cols);
      ctx.globalAlpha = alpha;
      ctx.drawImage(img, c * info.frameWidth, r * info.frameHeight, info.frameWidth, info.frameHeight, 0, 0, canvas.width, canvas.height);
    }
    return {
      canvas, info,
      load() { if (!img.src) img.src = src; },
      draw(pos) {
        if (!ready) return;
        const i = Math.floor(pos) % info.frames, j = (i + 1) % info.frames, f = pos - Math.floor(pos);
        ctx.globalCompositeOperation = 'copy';
        frameAt(i, 1);
        ctx.globalCompositeOperation = 'source-over';
        frameAt(j, f);
        ctx.globalAlpha = 1;
      },
    };
  }
  const fire = spriteLayer($('fire'), F, 'assets/cabin/fire-sprite.jpg');

  // Fares rocks in his chair when you give him a push. The chair was rendered tilted at evenly
  // spaced angles; a damped swing picks the angle and we crossfade between the two nearest
  // frames, drawn only where the mask says the chair and Fares move.
  const rocker = R ? (() => {
    const canvas = $('rock'), ctx = canvas.getContext('2d'), btn = $('faresBtn');
    const at = (el, b) => Object.assign(el.style, {
      left: b.x0 * 100 + '%', top: b.y0 * 100 + '%', width: (b.x1 - b.x0) * 100 + '%', height: (b.y1 - b.y0) * 100 + '%' });
    at(canvas, R.crop);
    at(btn, R.hotspot);
    btn.hidden = false;
    const sheet = new Image(), mask = new Image();
    let ready = 0;
    sheet.onload = mask.onload = () => { ready += 1; };
    const mid = (R.frames - 1) / 2;
    const STIFF = (2 * Math.PI / 1.7) ** 2, DAMP = 0.7;      // a 1.7 s swing that dies away over ~10 s
    let angle = 0, speed = 0, state = 'still', opacity = 0;
    function frame(k, alpha) {
      const c = k % R.cols, r = Math.floor(k / R.cols);
      ctx.globalAlpha = alpha;
      ctx.drawImage(sheet, c * R.frameWidth, r * R.frameHeight, R.frameWidth, R.frameHeight, 0, 0, canvas.width, canvas.height);
    }
    function draw() {
      const pos = Math.max(0, Math.min(R.frames - 1, mid + angle * mid));
      const i = Math.floor(pos), f = pos - i;
      ctx.globalCompositeOperation = 'copy';
      frame(i, 1);
      ctx.globalCompositeOperation = 'source-over';
      if (f > 0.002 && i + 1 < R.frames) frame(i + 1, f);
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'destination-in';
      ctx.drawImage(mask, 0, 0, canvas.width, canvas.height);
      ctx.globalCompositeOperation = 'source-over';
    }
    btn.addEventListener('click', () => {
      if (ready < 2) return;
      const kick = reduceMotion ? 1.2 : 3.6;
      if (state !== 'rocking') { state = 'rocking'; speed -= kick; }         // the first push sends him back
      else speed += (speed <= 0 ? -1 : 1) * kick * 0.6;                     // pushing again adds to the swing
    });
    return {
      canvas, info: R,
      load() { if (!sheet.src) { sheet.src = 'assets/cabin/rock-sprite.jpg'; mask.src = 'assets/cabin/rock-mask.png'; } },
      stop() { state = 'still'; angle = speed = opacity = 0; canvas.style.opacity = '0'; },
      update(dt) {
        if (state === 'still') return;
        if (state === 'rocking') {
          const n = Math.max(1, Math.ceil(dt / 0.008)), h = dt / n;
          for (let k = 0; k < n; k++) {
            speed += (-STIFF * angle - DAMP * speed) * h;
            angle += speed * h;
            if (angle > 1) { angle = 1; speed = Math.min(speed, 0); }
            if (angle < -1) { angle = -1; speed = Math.max(speed, 0); }
          }
          opacity = Math.min(1, opacity + dt / 0.12);
          if (Math.hypot(angle, speed / Math.sqrt(STIFF)) < 0.025) { angle = 0; speed = 0; state = 'settling'; }
        } else {
          opacity -= dt / 0.35;                                                 // back to the room image at rest
          if (opacity <= 0) { this.stop(); return; }
        }
        draw();
        canvas.style.opacity = opacity.toFixed(3);
      },
    };
  })() : null;
  function fireLight(pos) {
    const i = Math.floor(pos) % F.frames, j = (i + 1) % F.frames, f = pos - Math.floor(pos);
    const A = F.flicker[i], B = F.flicker[j];
    return { a: A[0] + (B[0] - A[0]) * f, b: A[1] + (B[1] - A[1]) * f };
  }
  const snowCanvas = $('snow'), sctx = snowCanvas.getContext('2d');
  const win = S.window;
  const wx0 = Math.min(...win.map((p) => p[0])), wx1 = Math.max(...win.map((p) => p[0]));
  const wy0 = Math.min(...win.map((p) => p[1])), wy1 = Math.max(...win.map((p) => p[1]));
  Object.assign(snowCanvas.style, { left: wx0 * 100 + '%', top: wy0 * 100 + '%', width: (wx1 - wx0) * 100 + '%', height: (wy1 - wy0) * 100 + '%' });
  const flakes = Array.from({ length: 110 }, () => ({ u: Math.random(), v: Math.random(), depth: Math.random(), phase: Math.random() * 6.28 }));
  const bars = [[0.5, null, 0.022], [null, 1 / 3, 0.017], [null, 2 / 3, 0.017]];
  function drawWindowSnow(dt) {
    const cw = snowCanvas.width, ch = snowCanvas.height;
    sctx.clearRect(0, 0, cw, ch);
    const toCanvas = (u, v) => { const p = bilinear(win, u, v); return [(p[0] - wx0) / (wx1 - wx0) * cw, (p[1] - wy0) / (wy1 - wy0) * ch]; };
    sctx.save();
    sctx.beginPath();
    win.forEach((p, i) => { const q = toCanvas(i === 1 || i === 2 ? 1 : 0, i >= 2 ? 1 : 0); i ? sctx.lineTo(...q) : sctx.moveTo(...q); });
    sctx.closePath(); sctx.clip();
    for (const f of flakes) {
      f.v -= (0.04 + f.depth * 0.08) * dt;
      f.phase += dt * (0.5 + f.depth);
      f.u += Math.sin(f.phase) * 0.0007 * (0.5 + f.depth) - 0.003 * dt;
      if (f.v < -0.02) { f.v = 1.02; f.u = Math.random() * 1.1; }
      if (f.u < -0.05) f.u += 1.1;
      const [x, y] = toCanvas(f.u, f.v);
      const r = Math.max(1, (0.6 + f.depth * 1.4) * dpr * (W / 1400) * 1.8);
      const g = sctx.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, `rgba(222, 232, 245, ${0.22 + f.depth * 0.38})`);
      g.addColorStop(1, 'rgba(222, 232, 245, 0)');
      sctx.fillStyle = g;
      sctx.beginPath(); sctx.arc(x, y, r, 0, 6.283); sctx.fill();
    }
    sctx.globalCompositeOperation = 'destination-out';
    for (const [u, v, w] of bars) {
      sctx.beginPath();
      const pts = u !== null ? [toCanvas(u - w, 0), toCanvas(u + w, 0), toCanvas(u + w, 1), toCanvas(u - w, 1)]
                             : [toCanvas(0, v - w), toCanvas(1, v - w), toCanvas(1, v + w), toCanvas(0, v + w)];
      pts.forEach((q, i) => (i ? sctx.lineTo(...q) : sctx.moveTo(...q)));
      sctx.closePath(); sctx.fill();
    }
    sctx.restore();
  }

  // ---------------------------------------------------------------- sizing and the frame loop
  let W = 0, H = 0, dpr = 1;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    const r = stage.getBoundingClientRect();
    W = r.width; H = r.height;
    const size = (el, x0, x1, y0, y1) => { el.width = Math.max(1, Math.round((x1 - x0) * W * dpr)); el.height = Math.max(1, Math.round((y1 - y0) * H * dpr)); };
    size(snowFront, 0, 1, 0, 1);
    size(doorAnim, crop.x0, crop.x1, crop.y0, crop.y1);
    size(fire.canvas, F.crop.x0, F.crop.x1, F.crop.y0, F.crop.y1);
    if (rocker) size(rocker.canvas, R.crop.x0, R.crop.x1, R.crop.y0, R.crop.y1);
    size(snowCanvas, wx0, wx1, wy0, wy1);
    stage.style.setProperty('--tag', Math.max(8, H * 0.0115).toFixed(1) + 'px');   // number tags under hung pictures
  }
  new ResizeObserver(resize).observe(stage);
  resize();
  requestAnimationFrame(() => scrollTo(0.5));

  let scene = 'outside';
  let last = performance.now();
  let light = { a: 0.5, b: 0.5 };
  // the tree lights come up softly when you walk in, then glow gently, one set of bulbs and then the other
  let glowUp = 0;
  const GLOW_IN = 3.5, GLOW_PERIOD = 6;
  function treeGlow(now, dt) {
    glowUp = reduceMotion ? 1 : Math.min(1, glowUp + dt / GLOW_IN);
    const up = glowUp * glowUp * (3 - 2 * glowUp);
    const ph = reduceMotion ? 0 : (now / 1000) * 2 * Math.PI / GLOW_PERIOD;
    $('glowA').style.opacity = (up * (0.72 + 0.28 * Math.sin(ph))).toFixed(3);
    $('glowB').style.opacity = (up * (0.72 - 0.28 * Math.sin(ph))).toFixed(3);
  }
  function frame(now) {
    const step = Math.min(0.05, (now - last) / 1000);
    const dt = reduceMotion ? 0 : step;
    last = now;
    if (scene === 'outside') {
      drawFrontSnow(dt);
    } else {
      const pos = reduceMotion ? 0 : (now / 1000) * F.fps;
      fire.draw(pos);
      if (rocker) rocker.update(step);                  // only moves when someone pushes him, so it runs either way
      const target = reduceMotion ? { a: 0.5, b: 0.5 } : fireLight(pos);
      const k = Math.min(1, dt * 10);
      light = { a: light.a + (target.a - light.a) * k, b: light.b + (target.b - light.b) * k };
      $('imgLeft').style.opacity = light.a.toFixed(3);
      $('imgRight').style.opacity = (light.b * 0.85).toFixed(3);
      shadeWall(light);
      treeGlow(now, step);
      drawWindowSnow(dt);
      audio.update(light);
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // ---------------------------------------------------------------- arriving: ID, door, inside
  const login = $('login');
  login.addEventListener('cancel', (e) => e.preventDefault());     // the ID is required to go in
  if (M.sample) $('loginFine').textContent = 'Preview: the real member list isn\'t connected yet. Try DEMO-0001.';
  if (C.guestCode) $('guestCode').textContent = C.guestCode; else $('guestNote').hidden = true;
  let whoSeq = 0, whoTimer = 0;
  function showWho(html) {
    const who = $('idWho');
    who.innerHTML = html;
    who.classList.toggle('show', !!html);
  }
  $('lemsicId').addEventListener('input', () => {
    clearTimeout(whoTimer);
    $('loginError').textContent = '';
    $('lemsicId').removeAttribute('aria-invalid');
    const seq = ++whoSeq;
    whoTimer = setTimeout(async () => {
      const id = normalise($('lemsicId').value);
      let html = '';
      if (isCode(id, C.testCode)) html = '<span class="tick">✓</span>Test mode';
      else if (isCode(id, C.guestCode)) html = '<span class="tick">✓</span>Guest · not a LeMSIC member';
      else if (id.length >= 4) {
        const found = await lookUp(id);
        if (found) html = `<span class="tick">✓</span>${found.name ? 'Welcome, ' + esc(found.name) : 'LeMSIC member'}`;
      }
      if (seq === whoSeq) showWho(html);
    }, 180);
  });
  if ($('lemsicId').value) $('lemsicId').dispatchEvent(new Event('input'));
  const remembered = store.get('lemsic-advent-last-id');
  if (remembered) $('lemsicId').value = remembered;
  const doorReady = preloadDoor();
  login.showModal();

  $('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const input = $('lemsicId'), btn = $('loginBtn'), err = $('loginError');
    if (isCode(normalise(input.value), C.testCode)) {
      testMode = true;
      testWall = {};
      member = { id: 'TEST', key: 'test-mode' };
      input.removeAttribute('aria-invalid');
      err.textContent = '';
      $('testBadge').hidden = false;
      login.close();
      await goInside();
      return;
    }
    btn.disabled = true;
    btn.textContent = 'Checking…';
    const res = await checkId(input.value);
    btn.disabled = false;
    btn.textContent = 'Open the door';
    if (!res.ok) {
      err.textContent = res.msg;
      input.setAttribute('aria-invalid', 'true');
      input.focus();
      return;
    }
    input.removeAttribute('aria-invalid');
    err.textContent = '';
    member = { id: res.id, key: res.key, name: res.name, guest: !!res.guest };
    store.set('lemsic-advent-last-id', input.value.trim());
    syncWall();
    login.close();
    await goInside();
    toast(member.guest ? 'Welcome, guest! Make yourself at home by the fire.'
      : `Make yourself at home by the fire${member.name ? ', ' + member.name : ''}!`);
  });

  async function goInside() {
    fire.load();
    if (rocker) rocker.load();
    const outside = $('outside'), inside = $('inside');
    // have the room's images ready before we walk in, so nothing flashes or stutters
    const roomReady = Promise.all(['imgBase', 'imgLeft', 'imgRight', 'glowA', 'glowB'].map((id) => $(id).decode().catch(() => {})));
    glowUp = 0;
    renderTree();
    if (reduceMotion) {
      outside.hidden = true;
      inside.hidden = false;
      return arrived();
    }
    await Promise.race([doorReady, wait(2500)]);
    await wait(200);
    await playDoor();
    await Promise.race([roomReady, wait(2500)]);
    // walk through the doorway: the outside pushes in while the room comes into view
    const d = DOOR.doorway;
    const cx = (d[0][0] + d[1][0]) / 2, cy = (d[0][1] + d[2][1]) / 2;
    outside.style.transformOrigin = `${cx * 100}% ${cy * 100}%`;
    const push = outside.animate(
      [{ transform: 'scale(1)' }, { transform: 'scale(2.8)' }],
      { duration: 1900, easing: 'cubic-bezier(.42, 0, .3, 1)', fill: 'forwards' });
    await wait(650);
    inside.style.opacity = '0';
    inside.hidden = false;
    scene = 'inside';
    const enter = inside.animate(
      [{ opacity: 0, transform: 'scale(1.16)', filter: 'blur(5px)' },
       { opacity: 1, transform: 'scale(1)', filter: 'blur(0px)' }],
      { duration: 1500, easing: 'cubic-bezier(.25, .6, .25, 1)', fill: 'forwards' });
    await enter.finished;
    inside.style.opacity = '';
    enter.cancel();
    push.cancel();
    outside.hidden = true;
    arrived();
  }

  function arrived() {
    scene = 'inside';
    $('switchBtn').hidden = false;
    $('progress').hidden = false;
    scrollTo(0.5);
  }

  $('switchBtn').addEventListener('click', async () => {
    const outside = $('outside'), inside = $('inside');
    if (pop.open) pop.close();
    if (wallView.open) wallView.close();
    dctx.clearRect(0, 0, doorAnim.width, doorAnim.height);
    outside.hidden = false;
    if (!reduceMotion) {
      outside.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 900, easing: 'ease' });
      await inside.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 900, easing: 'ease' }).finished;
    }
    inside.hidden = true;
    scene = 'outside';
    member = null;
    testMode = false;
    testWall = {};
    $('testBadge').hidden = true;
    $('switchBtn').hidden = true;
    if (rocker) rocker.stop();
    $('progress').hidden = true;
    $('status').textContent = '1–24 December';
    $('lemsicId').value = '';
    showWho('');
    scrollTo(0.5);
    login.showModal();
  });

  // ---------------------------------------------------------------- the tree: one ornament a day
  function dateLabel(d) { return `${d} December`; }
  const ornButtons = {};
  function renderTree() {
    const wall = loadWall();
    const layer = $('ornaments');
    layer.textContent = '';
    for (const o of S.ornaments) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'orn';
      b.style.left = o.x * 100 + '%';
      b.style.top = o.y * 100 + '%';
      b.style.width = Math.max(o.r * 2.3, 0.02) * 100 + '%';
      const done = !!wall[o.day];
      if (done) b.classList.add('done');
      if (testMode) b.classList.add('testable');
      ornButtons[o.day] = b;
      if (o.day === today.day) b.classList.add('today');
      if (done || o.day === today.day) {
        b.insertAdjacentHTML('beforeend', `<span class="gtag ${done ? 'done' : 'today'}" aria-hidden="true">`
          + `<span class="gstring"></span><span class="gcard">${done ? '✓' : 'Today'}</span></span>`);
      }
      b.setAttribute('aria-label', `Day ${o.day}${o.day === today.day ? ', today' : ''}${done ? ', on your wall' : ''}`);
      b.addEventListener('click', () => ornamentClicked(o.day));
      layer.appendChild(b);
    }
    const n = Object.keys(wall).length;
    const prog = $('progress');
    prog.textContent = '';
    for (let d = 1; d <= 24; d++) {
      const i = document.createElement('i');
      if (wall[d]) i.className = 'on';
      if (d === today.day) i.classList.add('now');
      prog.appendChild(i);
    }
    prog.setAttribute('aria-label', `${n} of 24 pictures on your wall`);
    prog.title = `${n} of 24 pictures on your wall`;
    let status;
    if (testMode) status = 'Every ornament opens in test mode. Nothing is saved.';
    else if (today.day === 0) status = 'The calendar opens on 1 December. Come back then!';
    else if (today.day === 25) status = `Merry Christmas! You hung ${n} of 24 pictures on your wall.`;
    else status = `${today.preview ? 'Preview · ' : ''}Day ${today.day}: find today's ornament on the tree.`;
    $('status').textContent = status;
    renderWall();
  }

  function ornamentClicked(day) {
    if (testMode || day === today.day || loadWall()[day]) return showPicture(day);
    if (today.day === 0) return toast('The calendar opens on 1 December.');
    if (day > today.day) return toast(`Day ${day} opens on ${dateLabel(day)}.`);
    toast(`Day ${day} has passed. Each ornament opens only on its own day.`);
  }

  function esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
  // what pops out of each ornament: the picture and caption chosen in pictures.js
  function pictureFor(day) {
    const p = P[day] || {};
    return {
      picture: p.picture || `assets/days/day-${String(day).padStart(2, '0')}.png`,
      caption: p.caption || '',
      alt: p.alt || p.caption || `The picture for day ${day}`,
    };
  }

  // the picture pops out of the ornament and lands in front of you, its caption written underneath;
  // then you hang it on your wall
  const pop = $('popout');
  pop.addEventListener('click', (e) => { if (e.target === pop) pop.close(); });
  async function showPicture(day, origin) {
    const item = pictureFor(day);
    const hung = !!loadWall()[day];
    const img = $('popImg');
    img.src = item.picture;
    img.alt = item.alt;
    $('popCaption').textContent = item.caption;
    const note = testMode ? `Test mode · day ${day} · ${dateLabel(day)}. Nothing is saved.`
      : `Day ${day} · ${dateLabel(day)}${hung ? ' · on your wall' : ''}`;
    const back = wallView.open ? 'Back to the wall' : 'Back to the tree';
    $('popInfo').innerHTML = `<p>${esc(note)}</p>`
      + (hung ? `<button class="primary" type="button" id="popClose">${back}</button>`
              : '<button class="primary" type="button" id="hangBtn">Hang it on the wall</button>');
    if (hung) $('popClose').addEventListener('click', () => pop.close());
    else $('hangBtn').addEventListener('click', () => hang(day));
    await Promise.race([img.decode().catch(() => {}), wait(1500)]);
    fitPicture(img);
    pop.showModal();
    popFrom(origin || ornButtons[day]);
  }
  // hanging it: the print flies from your hands into its numbered frame on the wall
  function tagIn(day) {
    const tag = ornButtons[day] && ornButtons[day].querySelector('.gtag');
    if (tag && !reduceMotion) {
      tag.animate([{ opacity: 0, transform: 'rotate(-35deg) scale(0.6)' }, { opacity: 1, transform: 'rotate(16deg) scale(1)' }],
                  { duration: 650, easing: 'cubic-bezier(.3, 1.5, .5, 1)' });
    }
  }

  async function hang(day) {
    const print = $('popImg'), from = print.getBoundingClientRect();
    const wall = hangOnWall(day);
    const n = Object.keys(wall).length;
    const g = slot[day];
    pop.close();
    if (g && !reduceMotion) {
      scrollTo((g.picture[0] + g.picture[2]) / 2);            // phones scroll the room sideways
      await wait(80);
      const st = stage.getBoundingClientRect();
      const to = { x: st.left + g.picture[0] * st.width, y: st.top + g.picture[1] * st.height,
                   w: (g.picture[2] - g.picture[0]) * st.width, h: (g.picture[3] - g.picture[1]) * st.height };
      const flyer = document.createElement('img');
      flyer.className = 'flyer';
      flyer.src = print.src;
      flyer.alt = '';
      Object.assign(flyer.style, { left: from.left + 'px', top: from.top + 'px', width: from.width + 'px', height: from.height + 'px' });
      document.body.appendChild(flyer);
      const dx = to.x + to.w / 2 - (from.left + from.width / 2), dy = to.y + to.h / 2 - (from.top + from.height / 2);
      const k = Math.sqrt((to.w * to.h) / (from.width * from.height));
      await flyer.animate([
        { transform: 'translate(0, 0) scale(1) rotate(-1.5deg)', opacity: 1 },
        { transform: `translate(${dx * 0.55}px, ${dy * 0.35 - 60}px) scale(${0.5 + k * 0.5}) rotate(6deg)`, opacity: 1, offset: 0.55 },
        { transform: `translate(${dx}px, ${dy}px) scale(${k}) rotate(0deg)`, opacity: 1, offset: 0.9 },
        { transform: `translate(${dx}px, ${dy}px) scale(${k}) rotate(0deg)`, opacity: 0 },
      ], { duration: 1300, easing: 'cubic-bezier(.45, .05, .3, 1)' }).finished;
      renderTree();
      tagIn(day);
      flyer.remove();
      const hung = wallEl.querySelector(`.wpic[data-day="${day}"]`);
      if (hung) hung.animate([{ filter: 'brightness(1.8)' }, { filter: 'brightness(1)' }], { duration: 700, easing: 'ease-out' });
    } else {
      renderTree();
    }
    if (n >= 24 && !testMode) {
      await showPicture(day, wallEl.querySelector(`.wpic[data-day="${day}"]`));
      $('popInfo').innerHTML = `<p class="prize">${esc(C.prize)}</p>`
        + '<button class="primary" type="button" id="popClose">Back to the tree</button>';
      $('popClose').addEventListener('click', () => pop.close());
      return;
    }
    toast(`Day ${day} is on your wall · ${n} of 24${day === today.day && !testMode ? '. See you tomorrow by the fire!' : ''}`);
  }

  // ---------------------------------------------------------------- the picture wall
  // 24 frames on the log wall left of the tree; a hung picture is laid into its frame and shaded by
  // how that frame is lit in the room images (measured on its mat), following the firelight
  const G = S.gallery || [];
  const slot = Object.fromEntries(G.map((g) => [g.day, g]));
  const wallEl = $('wall');
  function renderWall() {
    wallEl.textContent = '';
    if (!member) return;
    const wall = loadWall();
    if (G.length) {                                       // the whole wall is one button: it opens the close-up
      const xs = G.flatMap((g) => [g.mat[0], g.mat[2]]), ys = G.flatMap((g) => [g.mat[1], g.plate[3]]);
      const x0 = Math.min(...xs) - 0.006, x1 = Math.max(...xs) + 0.006, y0 = Math.min(...ys) - 0.01, y1 = Math.max(...ys) + 0.008;
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'wallbtn';
      btn.dataset.label = 'Your picture wall';
      btn.setAttribute('aria-label', `Your picture wall: ${Object.keys(wall).length} of 24 pictures. Open it to see them.`);
      Object.assign(btn.style, { left: x0 * 100 + '%', top: y0 * 100 + '%', width: (x1 - x0) * 100 + '%', height: (y1 - y0) * 100 + '%' });
      btn.addEventListener('click', openWallView);
      wallEl.appendChild(btn);
    }
    for (const g of G) {
      if (!wall[g.day]) continue;
      const item = pictureFor(g.day);
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'wpic';
      b.dataset.day = g.day;
      const r = g.picture;
      Object.assign(b.style, { left: r[0] * 100 + '%', top: r[1] * 100 + '%', width: (r[2] - r[0]) * 100 + '%', height: (r[3] - r[1]) * 100 + '%' });
      b.setAttribute('aria-label', `Day ${g.day} on your wall${item.caption ? ': ' + item.caption : ''}`);
      const img = document.createElement('img');
      img.src = item.picture;
      img.alt = '';
      const shade = document.createElement('span');
      shade.className = 'shade';
      b.append(img, shade);
      const tag = document.createElement('span');
      tag.className = 'wtag';
      tag.textContent = g.day;
      Object.assign(tag.style, { left: (g.plate[0] + g.plate[2]) / 2 * 100 + '%', top: g.plate[1] * 100 + '%' });
      wallEl.append(b, tag);
    }
    shadeWall(light);
  }
  // the wall up close: all 24 frames; each picture hung so far opens on its own
  const wallView = $('wallView');
  $('wallClose').addEventListener('click', () => wallView.close());
  wallView.addEventListener('click', (e) => { if (e.target === wallView) wallView.close(); });
  function openWallView() {
    const wall = loadWall();
    const n = Object.keys(wall).length;
    $('wallCount').textContent = testMode ? `${n} of 24 · test mode` : `${n} of 24 pictures hung`;
    const grid = $('wallGrid');
    grid.textContent = '';
    for (let day = 1; day <= 24; day++) {
      const hung = !!wall[day];
      const item = pictureFor(day);
      const el = document.createElement(hung ? 'button' : 'div');
      el.className = 'wframe' + (hung ? '' : ' empty');
      if (hung) {
        el.type = 'button';
        el.setAttribute('aria-label', `Day ${day}${item.caption ? ': ' + item.caption : ''}. Open it.`);
        el.addEventListener('click', () => showPicture(day, el.querySelector('.print')));
      } else {
        el.setAttribute('aria-label', `Day ${day}: not hung yet`);
        el.title = day > today.day && !testMode ? `Opens on ${dateLabel(day)}` : `Day ${day}: not hung yet`;
      }
      el.innerHTML = `<span class="moulding"><span class="mat"><span class="print">${hung ? '' : day}</span></span></span>`
        + `<span class="plate">${day}</span>`;
      if (hung) {
        const img = document.createElement('img');
        img.src = item.picture;
        img.alt = '';
        img.loading = 'lazy';
        el.querySelector('.print').appendChild(img);
      }
      grid.appendChild(el);
    }
    wallView.showModal();
  }
  function shadeWall(l) {
    const w = 0.85 * l.b;
    for (const b of wallEl.querySelectorAll('.wpic')) {
      const t = slot[b.dataset.day].tint;
      if (!t) continue;
      const c = [0, 1, 2].map((i) => Math.round(255 * Math.min(1, 1.25 * ((t.low[i] * (1 - l.a) + t.left[i] * l.a) * (1 - w) + t.right[i] * w))));
      b.lastChild.style.background = `rgb(${c.join(',')})`;
    }
  }
  // size the picture to fit the screen whatever its shape, so the print hugs it
  function fitPicture(img) {
    const w = img.naturalWidth || 600, h = img.naturalHeight || 600;
    const maxW = Math.min(560, window.innerWidth - 72), maxH = Math.min(window.innerHeight * 0.56, 520);
    const k = Math.min(2, maxW / w, maxH / h);
    img.style.width = Math.round(w * k) + 'px';
    img.style.height = Math.round(h * k) + 'px';
  }
  function popFrom(btn) {
    const card = $('polaroid'), info = $('popInfo');
    if (reduceMotion || !btn) {
      card.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 300 });
      return;
    }
    const o = btn.getBoundingClientRect(), c = card.getBoundingClientRect();
    const ox = o.left + o.width / 2, oy = o.top + o.height / 2;
    const dx = ox - (c.left + c.width / 2), dy = oy - (c.top + c.height / 2);
    const s = Math.max(0.03, o.width / c.width);
    const burst = document.createElement('div');
    burst.className = 'burst';
    Object.assign(burst.style, { left: ox + 'px', top: oy + 'px', width: o.width * 2 + 'px', height: o.width * 2 + 'px' });
    pop.appendChild(burst);
    burst.animate([{ transform: 'translate(-50%, -50%) scale(.4)', opacity: 1 }, { transform: 'translate(-50%, -50%) scale(4)', opacity: 0 }],
      { duration: 800, easing: 'cubic-bezier(.2, .7, .3, 1)' }).finished.then(() => burst.remove());
    card.animate([
      { transform: `translate(${dx}px, ${dy}px) scale(${s}) rotate(-28deg)`, opacity: 0.3 },
      { transform: 'translate(0, 0) scale(1.05) rotate(2deg)', opacity: 1, offset: 0.68 },
      { transform: 'translate(0, 0) scale(1) rotate(-1.5deg)', opacity: 1 },
    ], { duration: 950, easing: 'cubic-bezier(.22, .8, .3, 1)' });
    info.animate([{ opacity: 0, transform: 'translateY(10px)' }, { opacity: 1, transform: 'none' }],
      { duration: 420, delay: 620, easing: 'ease-out', fill: 'backwards' });
  }

  // ---------------------------------------------------------------- crackling fire sound (generated, no files)
  const audio = (() => {
    let ctx = null, master = null, rumbleGain = null, timer = null, on = false, white = null;
    function noiseBuffer(seconds, brown) {
      const len = Math.floor(ctx.sampleRate * seconds), buf = ctx.createBuffer(1, len, ctx.sampleRate);
      const d = buf.getChannelData(0); let lastv = 0;
      for (let i = 0; i < len; i++) { const w = Math.random() * 2 - 1; if (brown) { lastv = (lastv + 0.02 * w) / 1.02; d[i] = lastv * 3.5; } else d[i] = w; }
      return buf;
    }
    function crackle() {
      if (!on) return;
      const now = ctx.currentTime, src = ctx.createBufferSource();
      src.buffer = white;
      const bp = ctx.createBiquadFilter();
      bp.type = 'bandpass'; bp.frequency.value = 1200 + Math.random() * 3800; bp.Q.value = 0.8 + Math.random() * 2;
      const g = ctx.createGain(), dur = 0.006 + Math.random() * 0.03;
      g.gain.setValueAtTime(0.15 + Math.random() * 0.5, now);
      g.gain.exponentialRampToValueAtTime(0.0008, now + dur);
      src.connect(bp).connect(g).connect(master);
      src.start(now, Math.random() * 1.5, dur + 0.02);
      timer = setTimeout(crackle, Math.random() < 0.3 ? 20 + Math.random() * 60 : 90 + Math.random() * 420);
    }
    function start() {
      if (!ctx) {
        ctx = new (window.AudioContext || window.webkitAudioContext)();
        master = ctx.createGain(); master.gain.value = 0.6; master.connect(ctx.destination);
        white = noiseBuffer(2, false);
        const rumble = ctx.createBufferSource(); rumble.buffer = noiseBuffer(4, true); rumble.loop = true;
        const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 520;
        rumbleGain = ctx.createGain(); rumbleGain.gain.value = 0;
        rumble.connect(lp).connect(rumbleGain).connect(master); rumble.start();
      }
      ctx.resume(); on = true; crackle();
    }
    function stop() { on = false; clearTimeout(timer); if (ctx) ctx.suspend(); }
    return {
      toggle() { on ? stop() : start(); return on; },
      update(f) { if (on && rumbleGain) rumbleGain.gain.setTargetAtTime(0.18 + 0.25 * (f.a + f.b) / 2, ctx.currentTime, 0.08); },
    };
  })();
  $('soundBtn').addEventListener('click', () => {
    const on = audio.toggle();
    $('soundBtn').setAttribute('aria-pressed', String(on));
    $('soundLabel').textContent = on ? 'Fire sound on' : 'Fire sound off';
  });
})();
</script>
</body>
</html>
