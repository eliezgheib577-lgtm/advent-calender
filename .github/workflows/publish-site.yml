# Publishes the advent calendar (site/) to GitHub Pages, with a fresh member ID list.
#
# Every 30 minutes, and whenever the site changes, it downloads the member list from
# its shared link, turns the IDs into fingerprints and seals each name with its own ID
# (site/assets/members.js), and publishes the site. The IDs, the names and the link
# never appear readable in the repository or the site.
#
# Setup (once), in the repository's Settings:
#   Secrets and variables > Actions > New repository secret:
#     MEMBERS_SHEET_URL   the shared link to the member list (anyone with the link can view)
#   It reads the "ID" tab, IDs from "ID_to_email" and names from "Full Name". If the sheet
#   changes, set variables MEMBERS_SHEET_TAB, MEMBERS_ID_COLUMN or MEMBERS_NAME_COLUMN.
#   Pages > Build and deployment > Source: GitHub Actions.
name: Publish site

on:
  push:
    paths: ["site/**", "tools/fetch_members.py", "tools/import_members.py", ".github/workflows/publish-site.yml"]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: publish-site
  cancel-in-progress: false

jobs:
  publish:
    # only the default branch publishes (scheduled runs always use it)
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      MEMBERS_SHEET_URL: ${{ secrets.MEMBERS_SHEET_URL }}
      # the LeMSIC membership workbook: the "ID" tab, IDs in "ID_to_email", names in "Full Name"
      MEMBERS_SHEET_TAB: ${{ vars.MEMBERS_SHEET_TAB || 'ID' }}
      MEMBERS_ID_COLUMN: ${{ vars.MEMBERS_ID_COLUMN || 'ID_to_email' }}
      MEMBERS_NAME_COLUMN: ${{ vars.MEMBERS_NAME_COLUMN || 'Full Name' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read the member list from the shared sheet
        if: env.MEMBERS_SHEET_URL != ''
        run: |
          pip install --quiet openpyxl
          python tools/fetch_members.py

      - name: No shared sheet set up yet
        if: env.MEMBERS_SHEET_URL == ''
        run: echo "::notice::MEMBERS_SHEET_URL is not set, so the site uses the member list committed in site/assets/members.js."

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
